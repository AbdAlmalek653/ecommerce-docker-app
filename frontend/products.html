<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تك شوب | المنتجات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">⚡ TechShop</a>
        <nav class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="products.html" style="color: var(--primary);">المنتجات</a>
            <a href="admin.html">لوحة الإدارة</a> <button class="btn btn-outline" onclick="openCart()">🛒 سلة المشتريات</button>
        </nav>
    </header>

    <div class="container">
        <div class="controls-bar">
            <div>
                <input type="text" id="searchInput" placeholder="ابحث عن منتج مذهل..." onkeyup="if(event.key === 'Enter') searchProducts()">
                <button class="btn" onclick="searchProducts()">🔍 بحث</button>
            </div>
            <select id="categorySelect" onchange="filterProducts()">
                <option value="">جميع الفئات</option>
                <option value="إلكترونيات">إلكترونيات</option>
                <option value="ملابس">ملابس</option>
                <option value="كتب">كتب</option>
            </select>
        </div>

        <div id="products-grid" class="products-grid">
            <h2 style="text-align: center; width: 100%; color: var(--text-muted);">⏳ جاري تحميل المنتجات...</h2>
        </div>
    </div>

    <div id="cartModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>🛒 سلة المشتريات</h2>
                <button onclick="closeCart()" style="background: none; border: none; color: var(--danger); font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            <div id="cartItems"></div>
            <div class="cart-total" id="cartTotal">الإجمالي: $0</div>
            <button class="btn" style="width: 100%;" onclick="checkout()">💳 إتمام الطلب الآن</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
