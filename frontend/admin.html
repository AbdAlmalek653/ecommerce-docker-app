<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تك شوب | لوحة الإدارة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيقات إضافية خاصة بلوحة الإدارة */
        .admin-form { background: var(--card-bg); padding: 30px; border-radius: 16px; margin-bottom: 40px; border: 1px solid rgba(255,255,255,0.05); }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; margin-left: 0; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }
        .admin-title { text-align: center; color: var(--primary); margin-bottom: 30px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">⚡ TechShop Admin</a>
        <nav class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="products.html">واجهة المتجر</a>
            <a href="admin.html" style="color: var(--primary);">لوحة الإدارة</a>
        </nav>
    </header>

    <div class="container" style="max-width: 900px;">
        <h2 class="admin-title">⚙️ لوحة تحكم المتجر</h2>

        <div class="admin-form">
            <h3 style="margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">➕ إضافة منتج جديد</h3>
            <form id="addProductForm" onsubmit="submitProduct(event)">
                <div class="form-group">
                    <label>اسم المنتج:</label>
                    <input type="text" id="name" placeholder="مثال: لوحة مفاتيح ميكانيكية" required>
                </div>
                <div class="form-group">
                    <label>الوصف:</label>
                    <textarea id="description" placeholder="مواصفات المنتج..." required></textarea>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>السعر ($):</label>
                        <input type="number" id="price" min="1" step="0.5" required>
                    </div>
                    <div class="form-group">
                        <label>الكمية:</label>
                        <input type="number" id="stock" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>الفئة:</label>
                        <select id="category" required>
                            <option value="إلكترونيات">إلكترونيات</option>
                            <option value="ملابس">ملابس</option>
                            <option value="كتب">كتب</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn" style="width: 100%; margin-top: 10px;">إضافة للمتجر</button>
            </form>
        </div>

        <div class="admin-form">
            <h3 style="margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">🗑️ إدارة المنتجات الحالية</h3>
            <div id="admin-products-grid" class="products-grid">
                <p style="text-align: center; width: 100%;">⏳ جاري التحميل...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
