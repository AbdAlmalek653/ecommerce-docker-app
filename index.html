<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الإلكتروني المتكامل</title>
    <style>
        /* --- التنسيقات (CSS) --- */
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        
        /* شريط التنقل العلوي */
        header { background: var(--primary); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 1.5rem; }
        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        input, select, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; outline: none; }
        
        /* الأزرار */
        .btn { background: var(--secondary); color: white; border: none; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn:hover { background: #2980b9; }
        .btn-cart { background: #f39c12; }
        .btn-cart:hover { background: #d68910; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: var(--success); width: 100%; margin-top: 10px; }
        .btn-success:hover { background: #219150; }

        /* شبكة المنتجات */
        .container { padding: 2rem 5%; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border: 1px solid #eee; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .category-badge { background: #eee; color: #555; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; display: inline-block; margin-bottom: 10px; }
        .product-price { color: var(--success); font-weight: bold; font-size: 1.3rem; margin: 15px 0; }

        /* نافذة السلة (Modal) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: white; width: 90%; max-width: 500px; border-radius: 8px; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--danger); }
        .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #f0f0f0; padding: 10px 0; }
        .cart-total { font-size: 1.2rem; font-weight: bold; text-align: left; margin-top: 15px; color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <h1>🛍️ متجري</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج..." onkeyup="handleSearch(event)">
            <button class="btn" onclick="executeSearch()">🔍 بحث</button>
            
            <select id="categorySelect" onchange="filterByCategory()">
                <option value="">جميع الفئات</option>
                <option value="إلكترونيات">إلكترونيات</option>
                <option value="ملابس">ملابس</option>
                <option value="كتب">كتب</option>
            </select>
            
            <button class="btn btn-cart" onclick="openCart()">🛒 سلة المشتريات</button>
        </div>
    </header>

    <div class="container">
        <div id="products-container" class="products-grid">
            <h3 style="text-align:center; grid-column: 1 / -1; color: #777;">⏳ جاري تحميل المنتجات...</h3>
        </div>
    </div>

    <div id="cartModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>🛒 سلة المشتريات</h2>
                <button class="close-btn" onclick="closeCart()">&times;</button>
            </div>
            <div id="cartItemsContainer">
                </div>
            <div class="cart-total" id="cartTotal">الإجمالي: $0</div>
            <button class="btn btn-success" onclick="checkout()">💳 إتمام الطلب الآن</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        // 1. جلب وعرض المنتجات (الوضع الافتراضي أو حسب الفئة)
        async function fetchProducts(category = '') {
            try {
                let url = `${API_URL}/products`;
                if (category) url += `?category=${category}`;
                
                const response = await fetch(url);
                const result = await response.json();
                renderProducts(result.data);
            } catch (error) {
                showError('فشل في الاتصال بالخادم. تأكد من تشغيل الـ Backend.');
            }
        }

        // 2. البحث عن المنتجات
        async function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return fetchProducts(); // العودة للكل إذا كان البحث فارغاً
            
            try {
                const response = await fetch(`${API_URL}/products/search?q=${query}`);
                const result = await response.json();
                renderProducts(result.data);
            } catch (error) {
                showError('حدث خطأ أثناء البحث.');
            }
        }

        // تفعيل البحث عند الضغط على Enter
        function handleSearch(event) {
            if (event.key === 'Enter') executeSearch();
        }

        // 3. فلترة المنتجات حسب الفئة
        function filterByCategory() {
            const category = document.getElementById('categorySelect').value;
            fetchProducts(category);
        }

        // 4. رسم المنتجات في الواجهة
        function renderProducts(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            if (!products || products.length === 0) {
                container.innerHTML = '<h3 style="text-align:center; grid-column: 1 / -1; color: #e74c3c;">لا توجد منتجات مطابقة للبحث!</h3>';
                return;
            }

            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <span class="category-badge">${p.category}</span>
                        <h3>${p.name}</h3>
                        <p style="color: #666; font-size: 0.9rem;">${p.description}</p>
                        <div class="product-price">$${p.price}</div>
                        <p style="font-size: 0.8rem; color: ${p.stock > 0 ? 'green' : 'red'};">
                            ${p.stock > 0 ? `المتوفر: ${p.stock}` : 'نفدت الكمية'}
                        </p>
                        <button class="btn" style="width: 100%;" onclick="addToCart('${p._id}', ${p.stock})" ${p.stock === 0 ? 'disabled' : ''}>
                            ${p.stock > 0 ? '🛒 إضافة للسلة' : '❌ غير متوفر'}
                        </button>
                    </div>
                `;
            });
        }

        // 5. إضافة منتج للسلة
        async function addToCart(productId, stock) {
            if (stock < 1) return alert('المنتج غير متوفر حالياً.');
            
            try {
                const response = await fetch(`${API_URL}/cart/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, quantity: 1 })
                });
                const result = await response.json();
                
                if (result.success) alert('✅ تمت إضافة المنتج بنجاح!');
                else alert('⚠️ خطأ: ' + result.message);
            } catch (error) {
                alert('❌ فشل الاتصال بالخادم.');
            }
        }

        // 6. فتح وعرض محتويات السلة
        async function openCart() {
            document.getElementById('cartModal').style.display = 'flex';
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = 'جاري التحميل...';
            
            try {
                const response = await fetch(`${API_URL}/cart`);
                const result = await response.json();
                
                if (result.success && result.data && result.data.items.length > 0) {
                    container.innerHTML = '';
                    result.data.items.forEach(item => {
                        // التأكد من أن المنتج لم يُحذف من قاعدة البيانات
                        if(item.product) {
                            container.innerHTML += `
                                <div class="cart-item">
                                    <div>
                                        <strong>${item.product.name}</strong><br>
                                        <small>الكمية: ${item.quantity} | السعر: $${item.product.price}</small>
                                    </div>
                                    <div style="font-weight: bold; color: var(--success);">
                                        $${item.product.price * item.quantity}
                                    </div>
                                </div>
                            `;
                        }
                    });
                    document.getElementById('cartTotal').innerText = `الإجمالي: $${result.data.totalPrice}`;
                } else {
                    container.innerHTML = '<p style="text-align: center; color: #777;">السلة فارغة حالياً.</p>';
                    document.getElementById('cartTotal').innerText = 'الإجمالي: $0';
                }
            } catch (error) {
                container.innerHTML = '<p style="color: red;">فشل في جلب السلة.</p>';
            }
        }

        function closeCart() {
            document.getElementById('cartModal').style.display = 'none';
        }

        // 7. إتمام الطلب وتفريغ السلة
        async function checkout() {
            try {
                const response = await fetch(`${API_URL}/cart/checkout`, { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    alert('🎉 ' + result.message);
                    closeCart();
                    fetchProducts(); // تحديث المنتجات لتعديل المخزون الجديد
                } else {
                    alert('⚠️ خطأ: ' + result.message);
                }
            } catch (error) {
                alert('❌ حدث خطأ أثناء إتمام الطلب.');
            }
        }

        function showError(msg) {
            document.getElementById('products-container').innerHTML = `<h3 style="text-align:center; grid-column: 1 / -1; color: #e74c3c;">❌ ${msg}</h3>`;
        }

        // إقلاع التطبيق: جلب المنتجات عند فتح الصفحة
        window.onload = () => fetchProducts();
    </script>
</body>
</html>
